[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pywaveletpanel"
version = "0.1.1"
description = "Wavelet-based panel data econometrics: structural breaks, scale-by-scale regression, and unit root testing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Dr. Merwan Roudane", email = "merwanroudane920@gmail.com"},
]
keywords = [
    "wavelets", "panel-data", "econometrics", "structural-breaks",
    "unit-root", "MODWT", "DWT", "Haar", "SAW-estimator",
    "time-scale-analysis", "fixed-effects",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "statsmodels>=0.13",
    "matplotlib>=3.5",
    "PyWavelets>=1.1",
    "rich>=12.0",
    "tabulate>=0.9",
]

[project.urls]
Homepage = "https://github.com/merwanroudane/pywaveletpanel"
Source = "https://github.com/merwanroudane/pywaveletpanel"
Repository = "https://github.com/merwanroudane/pywaveletpanel"
Issues = "https://github.com/merwanroudane/pywaveletpanel/issues"
Documentation = "https://github.com/merwanroudane/pywaveletpanel#readme"

[tool.setuptools.packages.find]
include = ["pywaveletpanel*"]
